<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wellspring — Water Data Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --riverstone:#E7ECE4;
    --basin:#16302F;
    --basin-soft:rgba(22,48,47,0.64);
    --basin-faint:rgba(22,48,47,0.38);
    --flow:#2C6E8E;
    --flow-deep:#1E5570;
    --sediment:#B9803F;
    --foam:#FBFAF5;
    --rust:#B44A2E;
    --line:rgba(22,48,47,0.14);
    --radius:2px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
  }

  body{
    margin:0;
    background:var(--riverstone);
    color:var(--basin);
    font-family:'Source Serif 4', Georgia, serif;
    -webkit-font-smoothing:antialiased;
  }

  .mono{font-family:'IBM Plex Mono', monospace; letter-spacing:0.04em;}
  .display{font-family:'Space Grotesk', sans-serif;}

  a{color:inherit;}
  a:focus-visible, button:focus-visible{outline:2px solid var(--flow); outline-offset:3px;}

  /* faint contour texture across the whole page */
  .contours{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    opacity:0.35;
    background-image:
      repeating-radial-gradient(circle at 12% 8%, transparent 0 46px, rgba(22,48,47,0.05) 47px 48px),
      repeating-radial-gradient(circle at 92% 82%, transparent 0 60px, rgba(44,110,142,0.05) 61px 62px);
  }

  .wrap{max-width:1120px; margin:0 auto; padding:0 32px; position:relative; z-index:1;}

  /* ---------- nav ---------- */
  header{
    position:sticky; top:0; z-index:20;
    background:rgba(231,236,228,0.86);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  nav.wrap{
    display:flex; align-items:center; justify-content:space-between;
    height:76px;
  }
  .brand{display:flex; align-items:center; gap:12px; text-decoration:none;}
  .brand svg{display:block;}
  .brand-text{display:flex; flex-direction:column; line-height:1;}
  .brand-name{font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:19px; letter-spacing:0.01em;}
  .brand-sub{font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.14em; color:var(--basin-soft); margin-top:4px;}

  .navlinks{display:flex; gap:36px; list-style:none; margin:0; padding:0;}
  .navlinks a{
    text-decoration:none; font-family:'IBM Plex Mono', monospace; font-size:12.5px;
    letter-spacing:0.08em; text-transform:uppercase; color:var(--basin-soft);
    padding-bottom:4px; border-bottom:1px solid transparent;
    transition:color 0.2s ease, border-color 0.2s ease;
  }
  .navlinks a:hover{color:var(--flow); border-color:var(--flow);}

  @media (max-width:720px){
    .navlinks{display:none;}
  }

  /* ---------- stations ---------- */
  .stations{position:relative; padding:64px 0 40px;}
  .river-bg{
    position:absolute; inset:0; width:100%; height:100%;
    z-index:0; opacity:0.5;
  }
  .river-bg path{
    fill:none; stroke:var(--flow); stroke-width:1.2; opacity:0.28;
  }

  .station{
    position:relative; z-index:1;
    padding:44px 0; border-top:1px solid var(--line);
    opacity:0; transform:translateY(18px);
    transition:opacity 0.7s ease, transform 0.7s ease;
  }
  .station.in-view{opacity:1; transform:translateY(0);}

  .station-tag{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.12em;
    text-transform:uppercase; color:var(--flow-deep);
    padding:5px 10px; border:1px solid var(--flow-deep); border-radius:var(--radius);
    margin-bottom:18px;
  }

  .station h2{
    font-family:'Space Grotesk', sans-serif; font-weight:600;
    font-size:clamp(22px, 2.6vw, 30px); margin:0 0 14px; letter-spacing:-0.005em;
  }

  .station p{
    font-size:16.5px; line-height:1.65; color:var(--basin-soft);
    margin:0 0 26px; max-width:46ch;
  }

  .cta{
    display:inline-flex; align-items:center; gap:9px;
    font-family:'IBM Plex Mono', monospace; font-size:13px; letter-spacing:0.05em;
    text-decoration:none; color:var(--foam); background:var(--basin);
    padding:12px 20px; border-radius:var(--radius);
    transition:background 0.2s ease, transform 0.2s ease;
  }
  .cta:hover{background:var(--flow-deep); transform:translateX(2px);}
  .cta svg{transition:transform 0.2s ease;}
  .cta:hover svg{transform:translateX(3px);}

  /* ---------- footer ---------- */
  footer{
    border-top:1px solid var(--line);
    padding:44px 0 60px;
    position:relative; z-index:1;
  }
  footer .wrap{display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:16px;}
  footer p{
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--basin-faint);
    margin:0; letter-spacing:0.02em; line-height:1.7; max-width:48ch;
  }
  .footer-mark{font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:14px; color:var(--basin-soft);}
</style>
</head>
<body>

<div class="contours" aria-hidden="true"></div>

<header>
  <nav class="wrap">
    <a class="brand" href="#top">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
        <circle cx="15" cy="15" r="14" fill="none" stroke="#16302F" stroke-width="1"/>
        <path d="M4 17 Q 9 11, 15 17 T 26 15" fill="none" stroke="#2C6E8E" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span class="brand-text">
        <span class="brand-name">Wellspring</span>
        <span class="brand-sub">WATER DATA TOOLS</span>
      </span>
    </a>
    <ul class="navlinks">
      <li><a href="https://nm-water-data-viewer.cristopher-morton.workers.dev/" target="_blank" rel="noopener noreferrer">Viewer</a></li>
      <li><a href="https://nm-wqp-downloader.cristopher-morton.workers.dev/" target="_blank" rel="noopener noreferrer">Downloader</a></li>
      <li><a href="https://pods-trends-viewer.cristopher-morton.workers.dev/" target="_blank" rel="noopener noreferrer">Trends</a></li>
    </ul>
  </nav>
</header>

<main id="top">
  <section class="stations wrap">
    <svg class="river-bg" viewBox="0 0 1000 1200" preserveAspectRatio="none" aria-hidden="true">
      <path d="M100 0 C 400 150, 200 300, 700 380 S 250 650, 750 780 S 150 1000, 700 1200" />
    </svg>

    <article class="station" id="viewer">
      <div class="station-copy">
        <span class="station-tag">Map + hydrograph</span>
        <h2>Water Data Viewer</h2>
        <a class="cta" href="https://nm-water-data-viewer.cristopher-morton.workers.dev/" target="_blank" rel="noopener noreferrer" aria-label="Open the Water Data Viewer (opens in a new tab)">
          Open the viewer
          <svg width="14" height="10" viewBox="0 0 14 10" fill="none"><path d="M0 5H13M13 5L9 1M13 5L9 9" stroke="currentColor" stroke-width="1.3"/></svg>
        </a>
      </div>
    </article>

    <article class="station" id="downloader">
      <div class="station-copy">
        <span class="station-tag">Bulk export</span>
        <h2>WQP Downloader</h2>
        <a class="cta" href="https://nm-wqp-downloader.cristopher-morton.workers.dev/" target="_blank" rel="noopener noreferrer" aria-label="Open the WQP Downloader (opens in a new tab)">
          Start a download
          <svg width="14" height="10" viewBox="0 0 14 10" fill="none"><path d="M0 5H13M13 5L9 1M13 5L9 9" stroke="currentColor" stroke-width="1.3"/></svg>
        </a>
      </div>
    </article>

    <article class="station" id="trends">
      <div class="station-copy">
        <span class="station-tag">Diversion history</span>
        <h2>POD Trend Explorer</h2>
        <a class="cta" href="https://pods-trends-viewer.cristopher-morton.workers.dev/" target="_blank" rel="noopener noreferrer" aria-label="Open the POD Trend Explorer (opens in a new tab)">
          Explore trends
          <svg width="14" height="10" viewBox="0 0 14 10" fill="none"><path d="M0 5H13M13 5L9 1M13 5L9 9" stroke="currentColor" stroke-width="1.3"/></svg>
        </a>
      </div>
    </article>
  </section>
</main>

<footer>
  <div class="wrap">
    <span class="footer-mark">Wellspring</span>
    <p>New Mexico water data tools.</p>
  </div>
</footer>

<script>
  const stations = document.querySelectorAll('.station');
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('in-view');
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.18 });
    stations.forEach(s => io.observe(s));
  } else {
    stations.forEach(s => s.classList.add('in-view'));
  }
</script>

</body>
</html>
